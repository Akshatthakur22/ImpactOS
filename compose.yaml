services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sportdesk
      POSTGRES_USER: sportdesk
      POSTGRES_PASSWORD: sportdesk_dev_only
    ports:
      - "5432:5432"
    volumes:
      - sportdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportdesk -d sportdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sportdesk-postgres-data:
